[project]
name = "resnet-on-cifar-10"
version = "0.1.0"
description = "reproduce resnet on CIFAR-10"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux'"}
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux'"}

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[project.scripts]
resnet-on-cifar-10 = "resnet_on_cifar_10:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "resnet"